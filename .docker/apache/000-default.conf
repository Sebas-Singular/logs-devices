<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /usr/home/singularthings.io/web/logs-devices/public

    <Directory /usr/home/singularthings.io/web/logs-devices/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    <Directory /usr/home/singularthings.io/web/logs-devices/src>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/logs-devices-error.log
    CustomLog ${APACHE_LOG_DIR}/logs-devices-access.log combined
</VirtualHost>