name: Test

on:
  push:
  pull_request:

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci_root
          MARIADB_DATABASE: logs-devices
          MARIADB_USER: logs_user
          MARIADB_PASSWORD: ci_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, intl, zip, dom, xml, xmlwriter
          tools: composer:v2

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Wait for MariaDB
        run: |
          for i in {1..60}; do
            mysql -h 127.0.0.1 -P 3306 -u logs_user -pci_pass -e "SELECT 1" "logs-devices" && break
            echo "Waiting for MariaDB..."
            sleep 2
          done

      - name: Init database schema
        run: mysql -h 127.0.0.1 -P 3306 -u logs_user -pci_pass "logs-devices" < docker/mariadb/init/001_schema.sql

      - name: Create runtime config for CI
        run: |
          cat > src/Config/runtime.php <<'PHP'
          <?php

          declare(strict_types=1);

          return [
              'APP_ENV' => 'test',
              'APP_URL' => 'http://localhost',

              'LOG_INGEST_SECRET' => 'ci-secret',
              'LOG_INGEST_USER_AGENT' => 'WalkerPisa-Bridge-Logs',

              'DB_HOST' => '127.0.0.1',
              'DB_PORT' => '3306',
              'DB_DATABASE' => 'logs-devices',
              'DB_USERNAME' => 'logs_user',
              'DB_PASSWORD' => 'ci_pass',

              'VIEWER_AUTH_ENABLED' => 'false',
              'VIEWER_AUTH_USERNAME' => 'ci',
              'VIEWER_AUTH_PASSWORD' => 'ci',

              'REPROCESS_ENABLED' => 'false',
              'ADMIN_REPROCESS_TOKEN' => 'ci-admin-token',
              'ARCHIVE_RAW_ENDPOINT_ENABLED' => 'false',

              'SERVICES_LOGS_IMPORT_ENABLED' => 'false',
              'SERVICES_LOGS_STORAGE_PATH' => dirname(__DIR__, 2) . '/services/logs/storage',

              'INGEST_RATE_LIMIT_ENABLED' => 'false',
              'INGEST_RATE_LIMIT_MAX' => '1000',
              'INGEST_RATE_LIMIT_WINDOW_SECONDS' => '600',
          ];
          PHP

      - name: Run PHPUnit
        run: vendor/bin/phpunit
