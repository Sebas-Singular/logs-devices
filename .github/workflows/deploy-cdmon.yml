name: Deploy to cdmon

on:
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Upload web files by FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.DS_Store

            .env
            .env.*
            **/.env
            **/.env.*

            private/**
            storage/*.json
            storage/**/*.json
            storage/logs/**

            docs/**
            scripts/**
            tests/**
            vendor/**
            node_modules/**

            docker/**
            .docker/**
            docker-compose.yml
            Dockerfile

            index.php

            README.md
